# Ruff is used in this package both as a formatter and as a linter.
# The tables below define:
# - how Ruff formats Python files
# - which lint rules Ruff checks
# - how individual Ruff rule families are configured
[tool.ruff]
line-length = 120
src = []

[tool.ruff.format]
# Use single quotes for regular Python strings.
quote-style = "single"
# Keep Python's standard four-space indentation.
indent-style = "space"
# Do not use trailing commas as an implicit signal for line wrapping.
skip-magic-trailing-comma = true
# Always write LF line endings, regardless of the host operating system.
line-ending = "lf"

# Configure the rule families enabled for static analysis.
[tool.ruff.lint]

# `select` is the complete list of rule families that this package enables.
# Ruff does not infer additional rule families outside this list.
# The enabled families are:
# - `E` and `W` for pycodestyle checks
# - `F` for Pyflakes correctness checks
# - `Q` for quote-style enforcement
# - `B` for likely bug patterns from flake8-bugbear
# - `C4` for redundant comprehension simplifications
# - `I` for import ordering
# - `UP` for Python syntax upgrades
select = ["E", "W", "F", "Q", "B", "C4", "I"]

# Ignore the historical slice-spacing rule that conflicts with Black-style
# formatting and is still reported by pycodestyle.
extend-ignore = ["E203"]

# Configure the enabled `flake8-quotes` rule family.
[tool.ruff.lint.flake8-quotes]

# Enforce single quotes for inline strings.
inline-quotes = "single"

# Enforce double quotes for docstrings, following the usual PEP 257 convention.
docstring-quotes = "double"

[tool.ruff.lint.isort]
no-lines-before = []
split-on-trailing-comma = false
